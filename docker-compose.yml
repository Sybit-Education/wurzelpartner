name: wurzelpartner-backend

services:
  middleware:
    image: 'wurzelpartner-middleware:${MIDDLEWARE_RELEASE:?Offiziellen kompatiblen Release-Tag in .env.middleware setzen}'
    pull_policy: never
    build:
      context: 'https://github.com/stritti/nocodb-middleware.git#${MIDDLEWARE_RELEASE:?Offiziellen kompatiblen Release-Tag setzen}'
      dockerfile_inline: |
        FROM node:26-alpine AS builder
        WORKDIR /app
        RUN chown node:node /app
        USER node
        COPY --chown=node:node package*.json ./
        RUN npm ci
        COPY --chown=node:node . .
        RUN npm run build

        FROM node:26-alpine AS runtime
        ENV NODE_ENV=production
        WORKDIR /app
        RUN mkdir -p logs && chown -R node:node /app
        USER node
        COPY --chown=node:node package*.json ./
        RUN npm ci --omit=dev
        COPY --from=builder --chown=node:node /app/dist ./dist
        EXPOSE 3000
        CMD ["node", "dist/main.js"]
    environment:
      NODE_ENV: production
      PORT: '3000'
      NOCODB_API_URL: '${NOCODB_API_URL:?Container-erreichbare NocoDB-URL setzen}'
      NOCODB_API_TOKEN: '${NOCODB_API_TOKEN:?Serverseitigen NocoDB-Token setzen}'
      NOCODB_BASE_ID: '${NOCODB_BASE_ID:?NocoDB-Base-ID setzen}'
      NOCODB_TABLE_PREFIX: '${NOCODB_TABLE_PREFIX:-}'
      JWT_SECRET: '${JWT_SECRET:?Starkes JWT-Secret setzen}'
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN:-1d}'
      AUTH_PROVIDER: local
      CORS_ORIGINS: '${CORS_ORIGINS:?Tatsaechliche Frontend-Origin setzen}'
      LOG_DIR: /app/logs
      LOG_LEVEL: '${LOG_LEVEL:-info}'
    ports:
      - '127.0.0.1:${MIDDLEWARE_HTTP_PORT:-3000}:3000'
    volumes:
      - middleware-logs:/app/logs
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  middleware-logs:
